site_name: panchi
site_description: A Python-native linear algebra library for learning, experimentation, and visual intuition.
site_url: https://gustavo-galvao-e-silva.github.io/panchi
repo_url: https://github.com/Gustavo-Galvao-e-Silva/panchi
repo_name: panchi

theme:
  name: material
  favicon: assets/icon/panchi_icon.png
  custom_dir: overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: quickstart.md
  - User Guide:
    - Vectors: user-guide/vectors.md
    - Matrices: user-guide/matrices.md
    - Exact Arithmetic: user-guide/exact-arithmetic.md
    - Vector Spaces: user-guide/vector-spaces.md
    - Linear Transformations: user-guide/transformations.md
    - Row Operations: user-guide/row-operations.md
    - Row Reduction: user-guide/row-reduction.md
    - Decompositions: user-guide/decompositions.md
    - Solving Systems: user-guide/solving-systems.md
    - Visualizations: user-guide/visualizations.md
  - API Reference:
    - panchi: api/panchi.md
    - panchi.algorithms: api/algorithms.md
    - panchi.visualizations: api/visualizations.md
  - Contributing: contributing.md
